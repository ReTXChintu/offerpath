# Builds the Windows installer and the Android APK for a version tag
# (v1.2.3, pushed by `pnpm release`), publishes them as a GitHub Release
# and, with the DEPLOY_* secrets set, uploads them to the server and updates
# it. Both builds get the server address from the OFFERPATH_SERVER_URL
# secret, e.g. http://203.0.113.10:50005. See docs/deploy.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check secrets and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$OFFERPATH_SERVER_URL" ]; then
            echo "::error::Set the OFFERPATH_SERVER_URL repository secret, e.g. http://203.0.113.10:50005"
            exit 1
          fi
          if [ "$HAS_UPDATER_KEY" = "true" ] && [ -z "$UPDATER_PUBKEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but TAURI_UPDATER_PUBKEY isn't. Add the matching public key."
            exit 1
          fi
          node scripts/sync-versions.mjs --check
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=$(node -p "require('./package.json').version")
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}. Release with 'pnpm release'."
              exit 1
            fi
          fi

  desktop-windows:
    name: Desktop (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The desktop's frontend imports the workspace packages' built output
      # (@offerpath/ui, hunt, learn, ...), so build those first.
      - name: Build the packages the desktop uses
        run: pnpm turbo run build --filter="@offerpath/desktop^..."
      - name: Build installer
        env:
          # Both read at compile time: crates/offerpath-core/src/backend_url.rs
          # and apps/desktop/src-tauri/src/updates.rs.
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
          OFFERPATH_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            # Also writes <installer>.sig, which lets the app install updates itself.
            config=$(node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.OFFERPATH_UPDATER_PUBKEY}}}))')
            pnpm tauri build --config "$config"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this build can find updates but not install them in-app. See docs/deploy.md."
            pnpm tauri build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: offerpath-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig

  android:
    name: Mobile (Android)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Decode release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Add Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional: without it the APK builds and phones check periodically instead.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: building without Firebase push."
          fi
      - name: Warn about debug signing
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. This APK is signed with a throwaway debug key, so it can't install over a previous build."
      - name: Build APK
        env:
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The build number must increase for Android to accept an update.
          flutter build apk --release \
            --dart-define=OFFERPATH_SERVER_URL="$OFFERPATH_SERVER_URL" \
            --build-number=${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          mkdir -p dist
          # The server reads version and build number from this name.
          cp build/app/outputs/flutter-apk/app-release.apk "dist/offerpath-${VERSION}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: offerpath-android
          if-no-files-found: error
          path: apps/mobile/dist/*.apk

  # Optional: copy the builds to the server's downloads folder, where the
  # apps' update checks find them, then update and restart the server.
  deploy:
    name: Upload builds and update the server
    needs: [desktop-windows, android]
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TARGET: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_DEPLOY_TARGET != 'true'
        run: echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set; copy the builds to the server's apps/api/downloads/ by hand (docs/deploy.md)."
      - uses: actions/download-artifact@v4
        if: env.HAS_DEPLOY_TARGET == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - name: Copy the APK and the Windows installer to the server
        if: env.HAS_DEPLOY_TARGET == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          port="${DEPLOY_PORT:-22}"
          dest="${DEPLOY_PATH:-/opt/var/offerpath}/apps/api/downloads"
          ssh_opts=(-i "$key" -o StrictHostKeyChecking=accept-new)
          # Null-delimited: installer names can contain spaces.
          mapfile -d '' files < <(find artifacts \( -name '*.apk' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -print0)
          printf 'Uploading: %s\n' "${files[@]}"
          ssh "${ssh_opts[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$dest' && rm -f '$dest'/*.apk '$dest'/*-setup.exe '$dest'/*-setup.exe.sig"
          scp "${ssh_opts[@]}" -P "$port" "${files[@]}" "$DEPLOY_USER@$DEPLOY_HOST:$dest/"
          rm -f "$key"
      - name: Update and restart the server
        if: env.HAS_DEPLOY_TARGET == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          repo="${DEPLOY_PATH:-/opt/var/offerpath}"
          ssh -i "$key" -o StrictHostKeyChecking=accept-new -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd \"$repo\" && git pull --ff-only && bash scripts/server-update.sh"
          rm -f "$key"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
