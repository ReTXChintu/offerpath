# Builds the Windows installer and the Android APK for a version tag
# (v1.2.3, pushed by `pnpm release`) and publishes them as a GitHub Release.
# Both builds get the server address from the OFFERPATH_SERVER_URL secret,
# e.g. http://203.0.113.10:50010.
#
# Later phases add: the signed Tauri updater artifacts, the release signing
# key for Android, Firebase config, and the upload + server update over SSH.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check secrets and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
        run: |
          if [ -z "$OFFERPATH_SERVER_URL" ]; then
            echo "::error::Set the OFFERPATH_SERVER_URL repository secret, e.g. http://203.0.113.10:50010"
            exit 1
          fi
          node scripts/sync-versions.mjs --check
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=$(node -p "require('./package.json').version")
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}. Release with 'pnpm release'."
              exit 1
            fi
          fi

  desktop-windows:
    name: Desktop (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        env:
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: offerpath-windows
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

  android:
    name: Mobile (Android)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build APK
        env:
          OFFERPATH_SERVER_URL: ${{ secrets.OFFERPATH_SERVER_URL }}
        run: |
          # The build number must increase for Android to accept an update.
          flutter build apk --release \
            --dart-define=OFFERPATH_SERVER_URL="$OFFERPATH_SERVER_URL" \
            --build-number=${{ github.run_number }}
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/offerpath-${VERSION}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: offerpath-android
          if-no-files-found: error
          path: apps/mobile/dist/*.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
