name: offerpath_mobile
description: "Offerpath on your phone: today's plan, learning on the go, and approvals for your desktop's job hunt."
publish_to: 'none'
# X.Y.Z is the repo-wide version (`pnpm release` stamps it); +N is the build
# number, which CI overrides with the run number.
version: 0.3.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.0.1
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Spoken mock interviews. The platform recogniser turns speech into text on
  # the phone: nothing is recorded and no audio leaves the device.
  speech_to_text: ^7.3.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
