name: offerpath_mobile
description: "Offerpath on your phone: today's plan, learning on the go, and approvals for your desktop's job hunt."
publish_to: 'none'
# X.Y.Z is the repo-wide version (`pnpm release` stamps it); +N is the build
# number, which CI overrides with the run number.
version: 0.5.0+6

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.0.1
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Spoken mock interviews. The platform recogniser turns speech into text on
  # the phone: nothing is recorded and no audio leaves the device.
  speech_to_text: ^7.3.0
  file_picker: ^13.1.0
  # Live practice: streams the microphone (PCM16, 24 kHz) to OpenAI Realtime
  # with a short-lived pass from the API, and keeps the screen on while
  # listening. Exact pins: newer releases are under the two-week rule.
  record: 7.1.1
  wakelock_plus: 1.8.1
  # Live practice: recognises the user's voice on the phone (a speaker
  # embedding from sherpa-onnx's WeSpeaker model, which the app downloads
  # once from the server), so only the interviewer's questions are answered.
  sherpa_onnx: 1.13.8
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
