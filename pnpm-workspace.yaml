packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies permitted to run install scripts (pnpm 12 supply-chain policy).
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  unrs-resolver: true
  # Analytics postinstall only; nothing needs it to build.
  '@scarf/scarf': false
